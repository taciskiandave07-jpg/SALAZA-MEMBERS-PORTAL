<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Salaza Portal</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #11102b 50%, #02040a 100%);
            --glass-bg: rgba(22, 32, 54, 0.55);
            --glass-border: rgba(255, 255, 255, 0.07);
            --accent-blue: #38bdf8;
            --accent-neon: #818cf8;
            --accent-green: #34d399;
            --accent-crimson: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* 1. INTRO SPLASH ANIMATION */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeOutSplash 1s ease 2.5s forwards; /* Reduced duration slightly for developer sanity */
        }

        .splash-logo {
            font-size: 90px;
            color: var(--accent-blue);
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
            transform: scale(0.3) rotate(-30deg);
            animation: popLogo 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        .splash-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            letter-spacing: 5px;
            margin-top: 25px;
            color: #fff;
            opacity: 0;
            transform: translateY(40px);
            animation: slideTitle 1.2s ease 1.3s forwards;
        }

        @keyframes popLogo {
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes slideTitle {
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOutSplash {
            100% { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        /* AUTH MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hidden { display: none !important; }

        /* 3D GLASS CARD STYLING */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 
                        inset 0 1px 2px rgba(255,255,255,0.1);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
            margin-bottom: 25px;
        }
        .glass-card:hover {
            transform: translateY(-4px) rotateX(2deg);
            box-shadow: 0 40px 70px rgba(56, 189, 248, 0.08), inset 0 1px 3px rgba(255,255,255,0.2);
        }

        .auth-card { width: 100%; max-width: 450px; }

        /* MAIN APP CONTAINER WITH DRAWER DESIGN LAYOUT */
        #app-container {
            display: flex;
            min-height: 100vh;
        }

        /* LEFT SIDEBAR / DRAWER NAV */
        nav.sidebar-drawer {
            width: 280px;
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(25px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            position: fixed;
            height: 100vh;
            z-index: 500;
        }

        .drawer-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        .drawer-logo {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-neon));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            font-size: 30px;
            color: #fff;
        }

        .drawer-brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .drawer-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .drawer-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
        }

        .drawer-btn i {
            font-size: 18px;
            width: 24px;
            transition: transform 0.3s ease;
        }

        .drawer-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            transform: translateX(4px);
        }

        .drawer-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.15));
            border-color: rgba(56, 189, 248, 0.3);
            color: var(--accent-blue);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .drawer-btn.active i {
            transform: scale(1.15);
        }

        /* MAIN APP VIEWSTREAM */
        .viewport {
            flex-grow: 1;
            margin-left: 280px;
            padding: 40px 5%;
            min-height: 100vh;
        }

        .view-section {
            animation: fadeInView 0.4s ease-out forwards;
        }

        @keyframes fadeInView {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* TOP CONTEXT BAR */
        .context-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-blue);
            text-transform: uppercase;
        }

        /* GLOBAL FORM DESIGN Elements */
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        input, textarea, select {
            width: 100%;
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 14px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }
        input[type="date"]::-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* BUTTON ENGINE */
        .btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-neon));
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.4);
        }
        .btn-secondary { background: transparent; border: 1px solid var(--text-muted); color: #fff; }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); box-shadow: none; transform: translateY(-1px); }
        .btn-danger { background: linear-gradient(135deg, var(--accent-crimson), #be123c); }
        .btn-danger:hover { box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4); }
        .btn-success { background: linear-gradient(135deg, var(--accent-green), #047857); color: #000; }
        .btn-success:hover { box-shadow: 0 10px 20px rgba(52, 211, 153, 0.4); }

        /* ADMIN NOTICES & CONTROL BADGES */
        .admin-badge {
            background: linear-gradient(135deg, var(--accent-crimson), #be123c);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .admin-controls {
            background: rgba(244, 63, 94, 0.06);
            border: 1px dashed var(--accent-crimson);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        /* BULLETINS */
        .announcement-box {
            background: rgba(56, 189, 248, 0.04);
            border-left: 4px solid var(--accent-blue);
            padding: 20px;
            border-radius: 0 14px 14px 0;
            margin-bottom: 20px;
            position: relative;
        }

        /* ISSUE GRID TRACKER & SYSTEM BOARDS */
        .feed-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }
        .issue-card {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }
        .issue-img {
            width: 100%; height: 200px; object-fit: cover;
            background: #090d16; display: flex; align-items: center;
            justify-content: center; color: var(--text-muted);
        }
        .issue-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        
        /* STATUS SYSTEM REGULATION */
        .status-badge {
            display: inline-block; padding: 4px 12px; border-radius: 30px;
            font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 12px;
            width: fit-content;
        }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-resolved { background: rgba(52, 211, 153, 0.2); color: var(--accent-green); }
        .status-unavailable { background: rgba(244, 63, 94, 0.2); color: var(--accent-crimson); }

        /* DATA REGISTRATION TABLES */
        .portal-table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
            background: rgba(10, 15, 30, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }
        .portal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }
        .portal-table th {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            font-weight: 700;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--glass-border);
        }
        .portal-table td {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .portal-table tr:last-child td { border: none; }

        /* RECEIPT TERMINAL DESIGN */
        .receipt-box {
            background: #ffffff;
            color: #0b0f19;
            padding: 25px;
            border-radius: 12px;
            font-family: monospace;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15), 0 15px 30px rgba(0,0,0,0.3);
            line-height: 1.5;
        }
        .receipt-header {
            text-align: center; border-bottom: 2px dashed #0b0f19;
            padding-bottom: 12px; margin-bottom: 15px; font-weight: bold;
        }

        /* RAPID HOTLINES */
        .hotline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }
        .hotline-item {
            background: rgba(10, 15, 30, 0.4);
            padding: 16px; border-radius: 10px;
            display: flex; align-items: center; justify-content: space-between;
            border-left: 4px solid var(--accent-crimson);
            border-top: 1px solid var(--glass-border);
        }

        /* DIRECTORY SLOTS WITH IMAGES */
        .officials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }
        .official-member {
            background: rgba(22, 32, 54, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 0 0 20px 0; text-align: center;
            position: relative; overflow: hidden;
        }
        .official-avatar {
            width: 100%; height: 220px; object-fit: cover;
            border-bottom: 1px solid var(--glass-border);
            background: #090d16; margin-bottom: 15px;
        }
        .official-info { padding: 0 15px; }
        .official-name { font-weight: 700; font-size: 19px; color: #fff; margin-bottom: 4px; }
        .official-role { font-size: 14px; color: var(--accent-blue); letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <!-- 1. INITIAL SYSTEM SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="splash-title">BARANGAY SALAZA PORTAL</div>
    </div>

    <!-- 2. SYSTEM GATE ENTRY GATEWAY MODALS -->
    <div id="auth-modal" class="modal-overlay">
        <!-- LOGIN VIEW -->
        <div id="login-card" class="glass-card auth-card">
            <h2 class="section-title" style="margin-bottom:20px;"><i class="fa-solid fa-lock"></i> Gate Entry Login</h2>
            <div class="form-group">
                <label>Username / Resident Code</label>
                <input type="text" id="login-user" placeholder="Enter Code or 'Salaza'">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="attemptLogin()" style="width: 100%; justify-content: center;">Access Portal System</button>
            <div style="margin-top: 20px; text-align: center; font-size: 14px;">
                <a href="#" onclick="toggleAuthView('signup')" style="color: var(--accent-blue); text-decoration: none; font-weight:600;">New Resident Account Registration</a><br><br>
                <a href="#" onclick="toggleAuthView('forgot')" style="color: var(--text-muted); text-decoration: none;">Forgot or Reset Password?</a>
            </div>
        </div>

        <!-- SIGNUP VIEW -->
        <div id="signup-card" class="glass-card auth-card hidden">
            <h2 class="section-title" style="margin-bottom:20px;"><i class="fa-solid fa-user-plus"></i> Account Sign Up</h2>
            <div class="form-group">
                <label>Create Username (Use your unique Barangay Salaza Code)</label>
                <input type="text" id="signup-code" placeholder="e.g. SALAZA-1029-2026">
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="signup-pass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="processSignup()" style="width: 100%; justify-content: center;">Register Profile</button>
            <p style="margin-top: 20px; text-align: center;"><a href="#" onclick="toggleAuthView('login')" style="color: var(--accent-blue); text-decoration: none;">Return to Login</a></p>
        </div>

        <!-- FORGOT CREDENTIALS VIEW -->
        <div id="forgot-card" class="glass-card auth-card hidden">
            <h2 class="section-title" style="margin-bottom:20px;"><i class="fa-solid fa-key"></i> Password Recovery</h2>
            <div class="form-group">
                <label>Enter Registered Username/Code</label>
                <input type="text" id="forgot-code" placeholder="Your account code">
            </div>
            <div class="form-group">
                <label>Type New Password</label>
                <input type="password" id="forgot-new-pass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="processPasswordReset()" style="width: 100%; justify-content: center;">Override Credentials</button>
            <p style="margin-top: 20px; text-align: center;"><a href="#" onclick="toggleAuthView('login')" style="color: var(--accent-blue); text-decoration: none;">Cancel</a></p>
        </div>
    </div>


    <!-- 3. MAIN PORTAL DESKTOP SYSTEM ENVIRONMENT -->
    <div id="app-container" class="hidden">
        
        <!-- CONTROL DRAWER BAR DESIGN -->
        <nav class="sidebar-drawer">
            <div class="drawer-brand">
                <div class="drawer-logo"><i class="fa-solid fa-shield-halved"></i></div>
                <h1>BARANGAY SALAZA<br><span style="font-size:12px; opacity:0.7;">PORTAL SYSTEM</span></h1>
            </div>

            <div class="drawer-menu">
                <button class="drawer-btn active" onclick="switchView('view-bulletin', this)"><i class="fa-solid fa-bullhorn"></i> Bulletins</button>
                <button class="drawer-btn" onclick="switchView('view-vehicle', this)"><i class="fa-solid fa-truck-ramp-box"></i> Vehicle Dispatch</button>
                <button class="drawer-btn" onclick="switchView('view-issues', this)"><i class="fa-solid fa-circle-exclamation"></i> Issue Reports</button>
                <button class="drawer-btn" onclick="switchView('view-clearance', this)"><i class="fa-solid fa-file-invoice"></
